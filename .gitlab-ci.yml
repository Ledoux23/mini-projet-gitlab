stages:
  - build
  - test
  - release
  - deploy

variables:
  IMAGE_NAME: 'mini-projet-gitlab'
  IMAGE_TAG: 'v1'
  DOCKER_USERNAME: 'mtt2023'
  #DOCKER_PASSWORD:
  HOST_PORT: 80
  CONTAINER_PORT: 80
  SERVER_USERNAME: 'ubuntu'

# Build image
docker-build:
  # Use the official docker image.
  stage: build
  image: docker:latest
  services: 
    - name: docker:dind
      alias: docker
  script:
    - docker build --no-cache -t  $IMAGE_NAME:$IMAGE_TAG .
    - docker save -o mini-projet-gitlab.tar $IMAGE_NAME:$IMAGE_TAG
  artifacts:
    paths:
      - mini-projet-gitlab.tar    

# Define test template
.test_templates: &test_templates
  stage: test
  before_script:
    - apk --no-cache add curl
  script:
    - docker load -i mini-projet-gitlab.tar
    - docker run --rm -dp $HOST_PORT:$CONTAINER_PORT --name $IMAGE_NAME $IMAGE_NAME:$IMAGE_TAG
    - sleep 5
    #- curl "http://docker:$CONTAINER_PORT" | grep -i 200
    - |
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://docker:$CONTAINER_PORT)
      echo "HTTP Status Code: $HTTP_CODE"
      if [ "$HTTP_CODE" != "200" ]; then
        echo "Test failed!"
        exit 1
      fi
      echo "Test successful!"

# Test
Test:
  stage: test
  image: docker:latest
  services: 
    - name: docker:dind
      alias: docker
  <<: *test_templates

# Define release template
.release_image: &release_image
  stage: release
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin # A utiliser quand la variable est sur gitlab
    #- docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD # A utiliser lorsque la variable est definie dans le code
    - docker load -i mini-projet-gitlab.tar
    - docker tag $IMAGE_NAME:$IMAGE_TAG $DOCKER_USERNAME/$IMAGE_NAME:$IMAGE_TAG
    - docker push $DOCKER_USERNAME/$IMAGE_NAME:$IMAGE_TAG

# Release
Release Image:
  stage: release
  image: docker:latest
  services: 
    - name: docker:dind
      alias: docker
  <<: *release_image

# Define deploy template
.deploy_app: &deploy_app
  stage: deploy
  before_script:
    - apk add --no-cache openssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d > /tmp/id_rsa
    - chmod 600 /tmp/id_rsa
    - ssh-add /tmp/id_rsa
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - ssh -o StrictHostKeyChecking=no -i /tmp/id_rsa $SERVER_USERNAME@$SERVER_IP "docker pull $DOCKER_USERNAME/$IMAGE_NAME:$IMAGE_TAG"
    - ssh -o StrictHostKeyChecking=no -i /tmp/id_rsa $SERVER_USERNAME@$SERVER_IP "docker run --rm -dp $HOST_PORT:$CONTAINER_PORT --name $IMAGE_NAME $DOCKER_USERNAME/$IMAGE_NAME:$IMAGE_TAG"
    
# Deploy in Review
Deploy Review:
  stage: deploy
  variables:
    SERVER_IP: '16.192.164.108'
  image: alpine
  <<: *deploy_app
  environment:
    name: Review

# Deploy in Staging
Deploy Staging:
  stage: deploy
  variables:
    SERVER_IP: '16.16.122.215'
  image: alpine
  <<: *deploy_app
  environment:
    name: Staging

# Deploy in Production
Deploy Production:
  stage: deploy
  variables:
    SERVER_IP: '13.63.20.17'
  image: alpine
  <<: *deploy_app
  environment:
    name: Production

